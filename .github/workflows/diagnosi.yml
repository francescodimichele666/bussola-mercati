name: Diagnosi fonti (temporaneo)
on:
  push:
    branches: [diagnosi-fonti]
    paths: [".github/**"]
permissions:
  contents: write
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica i file MEF
        run: python3 .github/mef.py
      - name: Salva
        run: |
          git config user.name bussola-bot; git config user.email bussola-bot@users.noreply.github.com
          git add mef_raw && git commit -m "Diagnosi: file MEF grezzi" && git push

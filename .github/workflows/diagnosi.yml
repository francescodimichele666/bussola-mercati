name: Diagnosi fonti (temporaneo)
on:
  push:
    branches: [diagnosi-fonti]
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Struttura del nuovo HICP
        run: |
          python3 - <<'PY'
          import json, urllib.request
          E = "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_minr"
          d = json.load(urllib.request.urlopen(E + "?format=JSON&lang=EN&lastTimePeriod=1&geo=IT"))
          for k in d["id"]:
              cat = d["dimension"][k]["category"]
              labs = cat.get("label", {})
              keys = list(cat["index"].keys()) if isinstance(cat["index"], dict) else cat["index"]
              print(k, len(keys), [(x, labs.get(x)) for x in keys[:8]])
          for geo in ["IT", "EA", "EA20", "EA21", "DE"]:
              for q in ["unit=RCH_A&coicop18=TOTAL", "unit=RCH_A&coicop=TOTAL", "unit=RCH_A&coicop18=CP00"]:
                  try:
                      x = json.load(urllib.request.urlopen(E + f"?format=JSON&lang=EN&sinceTimePeriod=2026-06&geo={geo}&{q}"))
                      print("OK", geo, q, x["value"], list(x["dimension"]["time"]["category"]["index"].keys()))
                  except Exception as e:
                      print("NO", geo, q, e)
          PY

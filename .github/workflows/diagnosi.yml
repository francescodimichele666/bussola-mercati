name: Diagnosi fonti (temporaneo)
on:
  push:
    branches: [diagnosi-fonti]
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il browser
        run: npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verifica completa del sito pubblicato
        run: mkdir -p shots && BASE=https://francescodimichele666.github.io/bussola-mercati/ SHOTS=shots node .github/audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: shots

name: Diagnosi fonti (temporaneo)
on:
  push:
    branches: [diagnosi-fonti]
    paths: [".github/**"]
permissions:
  contents: write
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/cal.py
      - run: |
          git config user.name bussola-bot; git config user.email bussola-bot@users.noreply.github.com
          git add cal_raw && git commit -m "Diagnosi: pagine calendario" && git push
